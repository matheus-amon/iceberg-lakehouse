# Trino's native log.properties format is one key=value per logger, not log4j2
# XML. Keys ending in `.levels` (or bare logger names) are translated by the
# launcher. Writing log4j2 syntax here makes the launcher parse
# "appender.console.name=STDOUT" as a log level and fail with
# "No enum constant io.airlift.log.Level.STDOUT".
io.trino=INFO