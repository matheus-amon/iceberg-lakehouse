http-server.http.port=8080
discovery.uri=http://trino:8080
query.max-memory=2GB
query.max-memory-per-node=1GB

# One node doing both jobs. There are no Trino workers in this compose file, so
# `node-scheduler.include-coordinator` has to be true -- with it false every
# query sits in QUEUED forever waiting for a worker that does not exist, and
# Trino reports nothing but a query id.
coordinator=true
node-scheduler.include-coordinator=true