connector.name = iceberg

# Trino 439's Iceberg connector only accepts REST, GLUE, JDBC or NESSIE as
# iceberg.catalog.type -- the `hadoop` and `hive` values were removed, and the
# error is a bare "Invalid value for type CatalogType" with no hint. JDBC on
# SQLite is the only one of the four that needs no second service, which is what
# makes `docker compose up` a one-liner.
#
# Note the property names. This version calls it connection-url (not
# catalog-uri) and has no schema-version key at all; both spellings are
# rejected as unused, and Trino refuses to start on an unused property rather
# than ignoring it.
iceberg.catalog.type = jdbc
iceberg.jdbc-catalog.driver-class = org.sqlite.JDBC
iceberg.jdbc-catalog.connection-url = jdbc:sqlite:/var/lib/trino/iceberg-catalog.db
iceberg.jdbc-catalog.default-warehouse-dir = file:///warehouse
iceberg.jdbc-catalog.catalog-name = lakehouse

# There is deliberately no iceberg.resource-vending.enabled here. The warehouse
# is a shared local volume rather than object storage, so there are no
# credentials to vend, and this version of the connector rejects the property as
# unused -- it refuses to start rather than ignoring a key it does not know.