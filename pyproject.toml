[project]
name = "iceberg-lakehouse"
version = "0.1.0"
description = "Streaming lakehouse on Apache Iceberg with data-quality observability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Kafka-compatible producer. confluent-kafka needs librdkafka; kafka-python
    # is pure Python and keeps the producer usable outside the compose network.
    "kafka-python>=2.0.2",
    # Trino query client, used by observability.
    "trino>=0.328.0",
    "pyarrow>=16.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"